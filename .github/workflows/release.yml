# Build the installers PlexFixer ships.
#
# Tauri compiles a native binary, so each platform is built on its own runner.
# The one exception is macOS: Xcode carries both architectures' SDKs, so a
# single macOS runner builds Apple Silicon and Intel.
#
# Pushing a tag like v0.2.1 builds everything and uploads it to that tag's
# release as a draft; "Run workflow" builds without publishing anything, which
# is the way to check a Windows build before tagging.
#
# Secrets, all optional — a missing one degrades the build rather than failing
# it, except the updater key:
#   TAURI_SIGNING_PRIVATE_KEY           signs update packages (required)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its passphrase
#   APPLE_CERTIFICATE                   base64 of a Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD          its password
#   APPLE_SIGNING_IDENTITY              e.g. "Developer ID Application: … (TEAMID)"
#
# Nothing here notarizes. PlexFixer is signed but deliberately not notarized;
# the DMG's "Allow PlexFixer to open.command" is the answer to Gatekeeper.
#
# Actions are pinned to a commit rather than a tag. A tag can be moved to point
# at different code; these jobs hold the signing key, so what runs in them is
# fixed until someone changes the line on purpose. The comment beside each is
# the release that commit is.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Space-separated targets, or "all"'
        default: all
        type: string

# Read-only unless a job says otherwise. The build jobs install dependencies
# and run their scripts, download other projects' binaries, and compile — none
# of which should be able to push to the repository. Only `publish` writes.
permissions:
  contents: read

jobs:
  # The suite is platform-independent, so it runs once on the cheapest runner
  # rather than three times. Catching a broken build here costs two minutes;
  # catching it after three 20-minute installer builds costs an hour.
  check:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform failing should not throw away another platform's build —
      # they take 20 minutes each.
      fail-fast: false
      matrix:
        include:
          # `macos-latest`, not a numbered image: GitHub retires those, and a
          # retired label does not fail the job, it cancels it before it starts
          # — which is how this stopped building without anything saying so.
          - name: macOS (Apple Silicon + Intel)
            runner: macos-latest
            targets: mac-arm mac-intel
            # Space separated, like `targets` above: this is split into
            # arguments by the shell. A comma makes it one target with a
            # comma in its name, which rustup rightly refuses.
            rust: aarch64-apple-darwin x86_64-apple-darwin
          - name: Windows x64
            runner: windows-latest
            targets: win
            rust: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Add Rust targets
        run: rustup target add ${{ matrix.rust }}
        shell: bash

      # tauri-cli takes several minutes to compile, so it is cached on its own
      # key rather than with the project's build artifacts.
      - name: Cache tauri-cli
        id: tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2-${{ runner.os }}

      - name: Install tauri-cli
        if: steps.tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # The ffmpeg binaries are 70–190 MB a platform and come from other
      # projects' releases; caching them keeps a re-run off those servers.
      - name: Cache ffmpeg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/bin
          # Every lib is in the key: they decide what qt-faststart, mp4tags
          # and dovi_tool are built from or fetched from, and a cache that
          # outlived a change to one would ship the old binary. dovi-tool.mjs
          # was missing from this list for as long as it has existed.
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs', 'scripts/lib/qt-faststart.mjs', 'scripts/lib/mp4tags.mjs', 'scripts/lib/dovi-tool.mjs', 'scripts/lib/move.mjs') }}

      # Which of this runner's targets the run actually asked for. A dispatch
      # can name targets belonging to the other runner, which is not an error
      # — it just leaves this one with nothing to do, and the steps below are
      # skipped rather than failing on an empty release/.
      - name: Pick targets
        id: pick
        shell: bash
        run: |
          targets="$RUNNER_TARGETS"
          if [ -n "$REQUESTED_TARGETS" ] && [ "$REQUESTED_TARGETS" != "all" ]; then
            kept=""
            for one in $REQUESTED_TARGETS; do
              case " $targets " in *" $one "*) kept="${kept:+$kept }$one";; esac
            done
            targets="$kept"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          if [ -z "$targets" ]; then
            echo "nothing for this runner in \"$REQUESTED_TARGETS\""
          else
            echo "building: $targets"
          fi
        env:
          # Through the environment rather than interpolated into the script:
          # a dispatch input is text someone typed, and `run:` would run it.
          RUNNER_TARGETS: ${{ matrix.targets }}
          REQUESTED_TARGETS: ${{ github.event.inputs.targets }}

      - name: Build
        if: steps.pick.outputs.targets != ''
        shell: bash
        run: |
          # A run that publishes nothing can be built without the update
          # signing key, which is what makes it possible to prove a platform
          # builds before that key goes anywhere near CI. A tag still fails
          # without it rather than publishing a release nobody can update to.
          extra=""
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "no TAURI_SIGNING_PRIVATE_KEY — building without update packages"
            extra="--no-updater"
          fi

          # A secret that was never set still arrives, as an empty string, and
          # the Tauri CLI takes the *presence* of APPLE_CERTIFICATE to mean
          # there is a certificate to import — so an empty one failed the
          # build at the codesigning step instead of skipping it. Unset them
          # and the build goes through unsigned, which is what a run that
          # proves the platform compiles actually wants.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY KEYCHAIN_PASSWORD
          fi

          node scripts/dist.mjs $BUILD_TARGETS $extra
        env:
          BUILD_TARGETS: ${{ steps.pick.outputs.targets }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.pick.outputs.targets != ''
        with:
          name: installers-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      # One manifest covering every platform. Built from the artifacts that
      # actually arrived, so a platform whose build failed is left out rather
      # than offered as an update that 404s.
      - name: Build the updater manifest
        run: node scripts/release-manifest.mjs --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

      # A release that is already published is left alone. Publishing one by
      # hand creates its tag, and the tag starts this workflow — which would
      # then replace the installers people are already downloading, and the
      # manifest the updater reads, with whatever this run built. A draft, or
      # no release at all, is what this job is for.
      - name: Upload
        run: |
          state="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          if [ "$state" = "false" ]; then
            echo "${GITHUB_REF_NAME} is already published — leaving its files as they are."
            exit 0
          fi
          if [ "$state" = "missing" ]; then
            gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes ""
          fi
          gh release upload "${GITHUB_REF_NAME}" release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
