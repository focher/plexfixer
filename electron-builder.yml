appId: com.timothyweaver.plexfixer
productName: PlexFixer
copyright: Copyright © 2026 Timothy Weaver

directories:
  buildResources: build
  output: release

# Fails the build if the bundled ffmpeg did not land where the app looks for it.
afterPack: scripts/after-pack.mjs

files:
  - out/**
  - package.json
  - '!**/*.map'

# Static ffmpeg/ffprobe are bundled per platform and land in
# `process.resourcesPath/bin/<platform>-<arch>/`, which `locate.ts` looks in.
#
# The platform name is written out literally in each platform's own block
# rather than using a `${platform}` macro: that macro expands to the *host*
# platform, so cross-building Windows from macOS silently packaged the macOS
# binaries. `${arch}` is the target arch and is correct. The afterPack hook
# fails the build if this ever regresses.

# Building the Windows installer from macOS/Linux needs Wine to run the NSIS
# uninstaller stub. electron-builder downloads it; pinning 1.0.1 gets Wine 11
# rather than the legacy 4.0.1 default, which no longer runs on current macOS.
# (The Wine build is x86_64, so Apple Silicon needs Rosetta 2.)
toolsets:
  wine: 1.0.1

asar: true
# ffmpeg is spawned as a child process, so it must stay outside the asar
# archive — extraResources already places it there.

mac:
  extraResources:
    - from: resources/bin/darwin-${arch}
      to: bin/darwin-${arch}
      filter:
        - '**/*'
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.video
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSDocumentsFolderUsageDescription: PlexFixer needs access to the folders holding your media files.
    NSDownloadsFolderUsageDescription: PlexFixer needs access to the folders holding your media files.
    NSRemovableVolumeUsageDescription: PlexFixer needs access to external drives holding your media files.
    NSNetworkVolumesUsageDescription: PlexFixer needs access to network shares holding your media files.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  extraResources:
    - from: resources/bin/win32-${arch}
      to: bin/win32-${arch}
      filter:
        - '**/*'
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: PlexFixer

linux:
  extraResources:
    - from: resources/bin/linux-${arch}
      to: bin/linux-${arch}
      filter:
        - '**/*'
  target:
    - AppImage
  category: AudioVideo
