[package]
name = "plexfixer"
version = "0.2.6"
description = "Analyze and fix MKV/M4V media files for reliable Plex direct play"
authors = ["Timothy Weaver"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "plexfixer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
serde_json = "1"
# Already compiled in — the updater uses it — so naming it here costs nothing
# but the line. See src/tmdb.rs for why the request is made from Rust at all.
# Already compiled in, and already configured for TLS, because the updater
# fetches over https with it. No TLS feature is named here on purpose: cargo
# unions features across the build, so this gets whatever the updater asked
# for — naming a different stack would pull a second one in beside it.
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "rt-multi-thread", "macros", "sync", "time"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
